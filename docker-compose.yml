services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: raspisaniye
      POSTGRES_PASSWORD: raspisaniye
      POSTGRES_DB: raspisaniye
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raspisaniye"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://raspisaniye:raspisaniye@db:5432/raspisaniye
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
